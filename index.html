<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мир Мурзика</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            text-align: center;
        }
        h1 { text-shadow: 0 0 10px #00ff00; }
        .form-container {
            border: 1px solid #00ff00;
            padding: 15px;
            margin: 20px auto;
            max-width: 600px;
            background-color: #1a1a1a;
            text-align: left;
        }
        input, button {
            display: block;
            width: 100%;
            margin: 10px 0;
            padding: 10px;
            background-color: #0d0d0d;
            color: #00ff00;
            border: 1px solid #00ff00;
            font-family: inherit;
            box-sizing: border-box;
        }
        button { cursor: pointer; font-weight: bold; }
        button:hover { background-color: #00ff00; color: #000; }
        .video-card {
            border: 1px solid #00ff00;
            padding: 15px;
            margin: 20px auto;
            max-width: 600px;
            background-color: #1a1a1a;
            text-align: left;
        }
        .video-card iframe {
            width: 100%;
            height: 315px;
            border: none;
            margin-top: 10px;
        }
        .video-title { font-size: 20px; margin-bottom: 5px; color: #00ff00; }
        .video-desc { color: #aaaaaa; font-size: 14px; }
    </style>
</head>
<body>
    <h1>Мир Мурзика</h1>
    <p>Моя личная соцсеть. Тут будут мои эдиты и мемы.</p>

    <div class="form-container">
        <h3>Добавить новое видео</h3>
        <input type="text" id="videoTitle" placeholder="Название видео (например, Мат трехлетнего мальчика)">
        <input type="text" id="videoLink" placeholder="ID видео с YouTube (например, dQw4w9WgXcQ)">
        <button onclick="addVideo()">Загрузить на сайт</button>
    </div>

    <div id="videoList"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ВСТАВЬ СЮДА СВОЙ КОД КОНФИГУРАЦИИ ИЗ FIREBASE (вместо того, что ниже)
        const firebaseConfig = {
  apiKey: "AIzaSyDVhxw_CQAsoPusbhX2HwowKa1CtAkDHg4",
  authDomain: "murzik-site.firebaseapp.com",
  projectId: "murzik-site",
  storageBucket: "murzik-site.firebasestorage.app",
  messagingSenderId: "269641301641",
  appId: "1:269641301641:web:21719be4a8abb49243d058",
  measurementId: "G-0JSW8FNB7G"
};
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.addVideo = async function() {
            const title = document.getElementById('videoTitle').value;
            const link = document.getElementById('videoLink').value;

            if (!title || !link) {
                alert("Заполни название и ссылку!");
                return;
            }

            try {
                await addDoc(collection(db, "videos"), {
                    title: title,
                    youtubeId: link,
                    timestamp: new Date()
                });
                alert("Видео добавлено!");
                document.getElementById('videoTitle').value = '';
                document.getElementById('videoLink').value = '';
                loadVideos();
            } catch (e) {
                alert("Ошибка: " + e.message);
            }
        }

        async function loadVideos() {
            const videoList = document.getElementById('videoList');
            videoList.innerHTML = '';

            const querySnapshot = await getDocs(collection(db, "videos"));
            querySnapshot.forEach((doc) => {
                const data = doc.data();
                const card = document.createElement('div');
                card.className = 'video-card';
                card.innerHTML = `
                    <div class="video-title">${data.title}</div>
                    <div class="video-desc">Добавлено: ${data.timestamp ? data.timestamp.toDate().toLocaleString() : 'недавно'}</div>
                    <iframe src="https://www.youtube.com/embed/${data.youtubeId}" allowfullscreen></iframe>
                `;
                videoList.appendChild(card);
            });
        }

        loadVideos();
    </script>
</body>
</html>
